<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.frame{width:1280px;height:720px;padding:64px 72px}
.glow{width:1300px;height:1300px;right:-420px;top:-620px}
.mark{font-size:30px}.mark i{width:13px;height:21px}
h1{font-size:118px;margin-top:70px;width:760px;letter-spacing:-.045em;line-height:.98}
h1 span{color:var(--accent);display:block}
.pill{position:absolute;left:72px;bottom:64px;font-size:30px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:10px;padding:12px 22px}
.msg{position:absolute;right:64px;width:440px;background:#313338;border-radius:14px;padding:22px 24px;font-size:22px;line-height:1.4;color:#dbdee1;box-shadow:0 24px 60px rgba(4,10,7,.55)}
.msg .who{font-weight:700;color:#fff}.msg .app{font-size:13px;background:#5865f2;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:3px}
.msg .t{font-size:15px;color:#949ba4;margin-left:8px}.msg p{margin-top:6px}.msg strong{color:#fff}
.m1{top:150px;transform:rotate(-2deg)}.m2{top:390px;transform:rotate(1.5deg)}
.clock{font-family:"Geist Mono",monospace;font-weight:500;color:var(--accent)}
</style></head><body><div class="frame">
<div class="glow"></div>
<div class="mark"><i></i>Quorum</div>
<h1>"We should" <span>to outside.</span></h1>
<div class="msg m1"><span class="who">quorum</span><span class="app">APP</span><span class="t">3:29 PM</span><p><strong>Locked: Morning stroll at Kachnar Park</strong><br>Votes: 1 / 0 / 0. Weather check at 05:30.</p></div>
<div class="msg m2"><span class="who">quorum</span><span class="app">APP</span><span class="t clock">06:00</span><p><strong>Good morning.</strong> Today: <strong>Kachnar Park</strong>, start 08:00.</p></div>
<div class="pill">30-second demo</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.frame{width:1000px;height:420px;padding:44px 56px}
.glow{width:900px;height:900px;right:-330px;top:-420px}
.mark{font-size:20px}.mark i{width:9px;height:15px}
h1{font-size:62px;margin-top:40px;width:600px}
h1 span{color:var(--accent);display:block}
.sub{font-size:20px;color:var(--muted);margin-top:18px;width:560px;line-height:1.35}
.trail{position:absolute;right:56px;top:96px;width:280px;list-style:none}
.trail::before{content:"";position:absolute;left:8px;top:6px;bottom:18px;width:2px;background:var(--line)}
.trail li{position:relative;padding:0 0 18px 34px;font-size:17px;font-weight:600}
.trail li i{position:absolute;left:0;top:1px;width:18px;height:24px;border-radius:2px;background:var(--accent)}
.trail li span{font-family:"Geist Mono",monospace;font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
</style></head><body><div class="frame">
<div class="glow"></div>
<div class="mark"><i></i>Quorum</div>
<h1>From "we should" <span>to outside.</span></h1>
<p class="sub">A Discord member that plans the outing, runs the poll, checks the rain and sends the 06:00 reminder.</p>
<ol class="trail">
<li><i></i>Options drafted<span>72 s</span></li>
<li><i></i>Plan locked<span>1 yes</span></li>
<li><i></i>Weather re-check<span>05:30</span></li>
<li><i></i>Reminder sent<span>06:00</span></li>
<li><i></i>Recap remembered</li>
</ol>
</div></body></html>
